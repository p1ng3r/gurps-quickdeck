name: Apply Phase 2 in-place pin UI

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - codex/v0.20.4-runtime-cleanup-phase1

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'codex/v0.20.4-runtime-cleanup-phase2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.20.4-runtime-cleanup-phase2
          fetch-depth: 0

      - name: Apply and validate in-place pin UI
        shell: bash
        run: |
          set -euo pipefail
          python .github/phase2-inplace-pin-ui.py
          node --check scripts/quickdeck-app.js
          node --check scripts/main.js
          grep -q 'syncRightDrawerFavoriteState(type, key, isActive)' scripts/quickdeck-app.js
          grep -q 'renderCenterAfterPinChange(reason)' scripts/quickdeck-app.js
          ! grep -q 'requestOverlayRender(\["center", "right"\], { reason: "favorite-attack" })' scripts/quickdeck-app.js
          ! grep -q 'requestOverlayRender(\["center", "right"\], { reason: "toggle-quick-skill" })' scripts/quickdeck-app.js
          ! grep -q 'requestOverlayRender(\["center", "right"\], { reason: "favorite-spell" })' scripts/quickdeck-app.js
          rm -f .github/phase2-inplace-pin-ui.py .github/phase2-inplace-pin-ui-trigger.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update pin state without replacing drawer"
          git push origin HEAD:codex/v0.20.4-runtime-cleanup-phase2

      - name: Remove one-use workflow from Phase 1
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/v0.20.4-runtime-cleanup-phase1
          git checkout -B cleanup-phase1 origin/codex/v0.20.4-runtime-cleanup-phase1
          git rm .github/workflows/apply-phase2-inplace-pin-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-use in-place pin workflow"
          git push origin HEAD:codex/v0.20.4-runtime-cleanup-phase1
