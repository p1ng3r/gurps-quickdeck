name: Apply Phase 2 region state fix

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - codex/v0.20.4-runtime-cleanup-phase1

permissions:
  contents: write

concurrency:
  group: phase2-region-state-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'codex/v0.20.4-runtime-cleanup-phase2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.20.4-runtime-cleanup-phase2
          fetch-depth: 0

      - name: Apply and validate region state fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/phase2-region-state-fix.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''if text.count("data-action") != original_action_count:\n    raise SystemExit("data-action occurrence count changed unexpectedly")\n''', '')
          path.write_text(text, encoding='utf-8')
          PY
          python .github/phase2-region-state-fix.py
          node --check scripts/quickdeck-app.js
          node --check scripts/main.js
          grep -q 'captureOverlayRegionScrollState' scripts/quickdeck-app.js
          grep -q 'restoreOverlayRegionFocusState' scripts/quickdeck-app.js
          grep -q 'activateInsertedOverlayRegion' scripts/quickdeck-app.js
          ! grep -q 'this.activateListeners($(staging));' scripts/quickdeck-app.js
          rm -f .github/phase2-region-state-fix.py .github/phase2-region-state-fix-trigger .github/phase2-region-state-fix-trigger.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve region scroll focus and live search"
          git push origin HEAD:codex/v0.20.4-runtime-cleanup-phase2

      - name: Remove one-use workflow from Phase 1
        shell: bash
        run: |
          git fetch origin codex/v0.20.4-runtime-cleanup-phase1
          git checkout -B phase1-cleanup origin/codex/v0.20.4-runtime-cleanup-phase1
          git rm .github/workflows/apply-phase2-region-state-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Phase 2 region state workflow"
          git push origin HEAD:codex/v0.20.4-runtime-cleanup-phase1
