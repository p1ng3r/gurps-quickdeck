name: Apply Phase 2 HP FP sync fix

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - codex/v0.20.4-runtime-cleanup-phase1

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'codex/v0.20.4-runtime-cleanup-phase2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.20.4-runtime-cleanup-phase2
          fetch-depth: 0

      - name: Apply and validate HP FP synchronization
        shell: bash
        run: |
          set -euo pipefail
          python .github/phase2-resource-sync-fix.py
          node --check scripts/quickdeck-app.js
          node --check scripts/main.js
          grep -q 'actor.update({ \[path\]: numericValue }, { render: true })' scripts/quickdeck-app.js
          grep -q 'on("change blur"' scripts/quickdeck-app.js
          grep -q 'actorUpdateTouchesQuickDeckResources' scripts/main.js
          grep -q 'renderQuickDeckIfOpen("center", 0)' scripts/main.js
          rm -f .github/phase2-resource-sync-fix.py .github/phase2-resource-sync-fix-trigger.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore HP and FP synchronization"
          git push origin HEAD:codex/v0.20.4-runtime-cleanup-phase2

      - name: Remove one-use workflow from Phase 1
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/v0.20.4-runtime-cleanup-phase1
          git checkout -B cleanup-phase1 origin/codex/v0.20.4-runtime-cleanup-phase1
          git rm .github/workflows/apply-phase2-resource-sync-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-use HP FP sync workflow"
          git push origin HEAD:codex/v0.20.4-runtime-cleanup-phase1
