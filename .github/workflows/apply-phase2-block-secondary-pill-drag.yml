name: Apply Phase 2 secondary pill drag guard

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - codex/v0.20.4-runtime-cleanup-phase1

permissions:
  contents: write

concurrency:
  group: phase2-secondary-pill-drag-guard
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'codex/v0.20.4-runtime-cleanup-phase2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.20.4-runtime-cleanup-phase2
          fetch-depth: 0

      - name: Apply and validate secondary-button guard
        shell: bash
        run: |
          python .github/phase2-block-secondary-pill-drag.py
          node --check scripts/quickdeck-app.js
          grep -q 'addEventListener("mousedown", this.onFloatingRestoreNonPrimaryMouse, true)' scripts/quickdeck-app.js
          grep -q 'addEventListener("contextmenu", this.onFloatingRestoreContextMenu, true)' scripts/quickdeck-app.js
          rm -f .github/phase2-block-secondary-pill-drag.py .github/phase2-block-secondary-pill-drag-trigger
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Block secondary-button restore pill dragging"
          git push origin HEAD:codex/v0.20.4-runtime-cleanup-phase2

      - name: Remove one-use workflow from Phase 1
        shell: bash
        run: |
          git fetch origin codex/v0.20.4-runtime-cleanup-phase1
          git checkout -B phase1-cleanup origin/codex/v0.20.4-runtime-cleanup-phase1
          git rm .github/workflows/apply-phase2-block-secondary-pill-drag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove secondary pill drag guard workflow"
          git push origin HEAD:codex/v0.20.4-runtime-cleanup-phase1
